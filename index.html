        setTimeout(() => { loaded() }, 1500);
        async function loaded() {
          document.querySelectorAll(".navs").forEach((nav) => nav.classList.add("loaded"));

      </script>
      <button class="menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
        <span class="sr-only">Open navigation</span>
      </button>

        <a class="navs" href="photos.html"><i class="fa fa-camera" aria-hidden="true"></i> Photos</a>
      </nav>
      <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const navBackdrop = document.querySelector(".nav-backdrop");
        const navigationLinks = document.querySelectorAll(".navs");

        function closeNavigation() {
          document.body.classList.remove("menu-open");
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.querySelector("i").className = "fa-solid fa-bars";
          menuToggle.querySelector(".sr-only").textContent = "Open navigation";
        }

        function toggleNavigation() {
          const isOpen = document.body.classList.toggle("menu-open");
          menuToggle.setAttribute("aria-expanded", String(isOpen));
          menuToggle.querySelector("i").className = isOpen
            ? "fa-solid fa-xmark"
            : "fa-solid fa-bars";
          menuToggle.querySelector(".sr-only").textContent = isOpen
            ? "Close navigation"
            : "Open navigation";
        }

        menuToggle.addEventListener("click", toggleNavigation);
        navBackdrop.addEventListener("click", closeNavigation);
        navigationLinks.forEach((link) => link.addEventListener("click", closeNavigation));
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeNavigation();
        });
      </script>
